# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
  # create-hummingbird-react-app templates are standalone projects (not
  # workspaces) with no lockfile, so ranges are raised in package.json
  # directly.
  - package-ecosystem: "npm"
    directories:
      - "/packages/create-hummingbird-react-app/templates/*"
    schedule:
      interval: "weekly"
    versioning-strategy: increase
    groups:
      template-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "chore(templates)"
    ignore:
      # Templates track the TypeScript line create-vite ships (~6.0.x).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
