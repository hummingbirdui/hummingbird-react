name: Template smoke test

# Scaffolds every create-hummingbird-react-app template, installs it from the
# registry exactly as a user would, and builds it. Runs when the CLI or its
# templates change, weekly to catch upstream framework drift, and on demand.
#
# @hummingbirdui/react comes from npm, except when the version the template
# asks for isn't published yet — the "chore(release): version packages" PR
# and the push that releases it point the templates at the version about to
# ship — or when the workflow is run by hand with library=workspace. Then the
# repo's own build is packed and installed instead, since that is the build
# the release will publish.
on:
  pull_request:
    paths:
      - "packages/create-hummingbird-react-app/**"
      - ".github/workflows/templates-smoke.yml"
  push:
    branches: [main]
    paths:
      - "packages/create-hummingbird-react-app/**"
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      library:
        description: "Where @hummingbirdui/react comes from"
        type: choice
        default: npm
        options:
          - npm
          - workspace

concurrency:
  group: templates-smoke-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: ${{ matrix.template }} (${{ matrix.pm }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        template: [nextjs, vite, astro, react-router, gatsby]
        pm: [npm]
        include:
          # pnpm's strict node_modules is the stricter test of CSS @import
          # resolution, and pnpm 11+ fails installs on unreviewed build scripts.
          - { template: vite, pm: pnpm }
          - { template: nextjs, pm: pnpm }
          - { template: gatsby, pm: pnpm }
    env:
      APP_DIR: ${{ github.workspace }}/../smoke-app
      NEXT_TELEMETRY_DISABLED: 1
      GATSBY_TELEMETRY_DISABLED: 1
      ASTRO_TELEMETRY_DISABLED: 1
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from "packageManager" in package.json
      - uses: pnpm/action-setup@v6

      # .nvmrc (22) satisfies every template, including Gatsby (< 26), but
      # frameworks raise their 22.x minimum over time (Astro 7 needs 22.23.4+),
      # so always use the newest 22.x rather than the runner's cached one.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo run build --filter=create-hummingbird-react-app

      # The repo pins pnpm 9 for itself; users run the latest pnpm, which is
      # stricter (allowBuilds, ERR_PNPM_IGNORED_BUILDS). Test the app with that.
      - name: Choose the app's package manager command
        run: |
          if [ "${{ matrix.pm }}" = "pnpm" ]; then
            echo "PM=npx --yes pnpm@latest" >> "$GITHUB_ENV"
          else
            echo "PM=npm" >> "$GITHUB_ENV"
          fi

      - name: Choose where @hummingbirdui/react comes from
        env:
          TEMPLATE_MANIFEST: packages/create-hummingbird-react-app/templates/${{ matrix.template }}/package.json
        run: |
          if [ "${{ inputs.library }}" = "workspace" ]; then
            echo "LIBRARY=workspace" >> "$GITHUB_ENV"
            exit 0
          fi
          range=$(node -p "require('./$TEMPLATE_MANIFEST').dependencies['@hummingbirdui/react']")
          if [ -n "$(npm view "@hummingbirdui/react@$range" version 2>/dev/null)" ]; then
            echo "LIBRARY=npm" >> "$GITHUB_ENV"
          else
            echo "::notice::@hummingbirdui/react@$range is not on npm yet (release in progress) — testing against the workspace build"
            echo "LIBRARY=workspace" >> "$GITHUB_ENV"
          fi

      - name: Pack the workspace library
        if: env.LIBRARY == 'workspace'
        run: |
          pnpm turbo run build --filter=@hummingbirdui/react
          cd packages/hummingbird-react
          pnpm pack --out "$RUNNER_TEMP/hummingbird-react.tgz"

      - name: Scaffold
        run: >
          node packages/create-hummingbird-react-app/dist/index.js "$APP_DIR"
          --template ${{ matrix.template }} --pm ${{ matrix.pm }} --no-install --no-git --yes

      - name: Use the workspace library
        if: env.LIBRARY == 'workspace'
        working-directory: ${{ env.APP_DIR }}
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.dependencies["@hummingbirdui/react"] = "file:" + process.env.RUNNER_TEMP + "/hummingbird-react.tgz";
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '

      - name: Install
        working-directory: ${{ env.APP_DIR }}
        run: $PM install

      - name: Type-check
        if: matrix.template == 'react-router' || matrix.template == 'gatsby'
        working-directory: ${{ env.APP_DIR }}
        run: $PM run typecheck

      - name: Build
        working-directory: ${{ env.APP_DIR }}
        run: $PM run build
