name: Release

on:
  push:
    branches: [main]

# Queue runs, never cancel one — a publish must not be killed mid-flight.
concurrency: release-${{ github.ref }}

permissions:
  contents: write # push the version commit to the changeset-release branch
  pull-requests: write # open/update the "Version Packages" PR
  id-token: write # npm Trusted Publishing (OIDC) + provenance

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      # No registry-url here: with npm Trusted Publishing (OIDC) there is no
      # NODE_AUTH_TOKEN, and the .npmrc that registry-url writes references it
      # unconditionally — npm then fails on the unset variable.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # npm Trusted Publishing (OIDC) requires npm >= 11.5.1; Node 22 bundles npm 10.
      - run: npm install -g npm@^11

      - name: Create Version PR or publish to npm
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: pnpm run version-packages
          publish-script: pnpm run release
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          create-github-releases: false

      # Changesets' own tags would be "@hummingbirdui/react@X.Y.Z"; we want
      # "vX.Y.Z" for the library, so publish runs with --no-git-tag and this
      # step tags instead. The CLI gets "create-hummingbird-react-app@X.Y.Z"
      # so the two never collide. See .github/scripts/tag-release.sh for the
      # guards (stable only, live on npm, idempotent, self-healing).
      - name: Tag and create GitHub Releases (stable only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .github/scripts/tag-release.sh packages/hummingbird-react "@hummingbirdui/react" "v"
          .github/scripts/tag-release.sh packages/create-hummingbird-react-app "create-hummingbird-react-app" "create-hummingbird-react-app@"
