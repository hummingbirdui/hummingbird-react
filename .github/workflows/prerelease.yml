name: Prerelease

# Manual one-off prereleases, published from whatever ref the workflow is run
# on. No commit, no git tag, no GitHub Release — just the version on the npm
# dist-tag named by its identifier (1.1.0-beta.0 → `beta`).
#
# @hummingbirdui/react and create-hummingbird-react-app always share one
# version (a Changesets "fixed" group), so both are published together at the
# given version.
#
# NOTE: this file must be registered as a trusted publisher on npmjs.com for
# both packages (Package Settings → Trusted Publisher → workflow filename
# "prerelease.yml") — npm OIDC auth is per workflow file and per package.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Prerelease version for both packages (e.g. 1.1.0-beta.0). Stable versions ship via the changesets loop in release.yml, not here."
        required: true
        type: string

# Share the queue with release.yml runs so two publishes never overlap.
concurrency: release-${{ github.ref }}

permissions:
  id-token: write # npm Trusted Publishing (OIDC) + provenance

env:
  # Same packages as .github/scripts/packages.sh.
  PACKAGE_DIRS: packages/hummingbird-react packages/create-hummingbird-react-app

jobs:
  prerelease:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # No registry-url here: with npm Trusted Publishing (OIDC) there is no
      # NODE_AUTH_TOKEN, and the .npmrc that registry-url writes references it
      # unconditionally — npm then fails on the unset variable.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # npm Trusted Publishing (OIDC) requires npm >= 11.5.1; Node 22 bundles npm 10.
      - run: npm install -g npm@^11

      - name: Validate version and derive dist-tag
        id: meta
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-[a-z]+(\.[0-9]+)?$'; then
            echo "::error::'$VERSION' must be a prerelease like 1.1.0-beta.0 — stable versions ship via the changesets loop"
            exit 1
          fi
          for dir in $PACKAGE_DIRS; do
            name=$(node -p "require('./$dir/package.json').name")
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "::error::$name@$VERSION is already published"
              exit 1
            fi
          done
          echo "tag=$(echo "$VERSION" | sed -E 's/^[0-9.]+-([a-z]+).*/\1/')" >> "$GITHUB_OUTPUT"

      # The CLI templates depend on the library, so they are pointed at the
      # prerelease too: a beta CLI scaffolds projects with the beta library.
      - name: Set package versions (not committed)
        run: |
          for dir in $PACKAGE_DIRS; do
            (cd "$dir" && npm version "${{ inputs.version }}" --no-git-tag-version)
          done
          node .github/scripts/sync-template-versions.mjs

      - run: pnpm turbo run build lint check-types test --filter=@hummingbirdui/react --filter=create-hummingbird-react-app

      # npm (not pnpm) so OIDC Trusted Publishing + provenance apply. Dry-runs
      # both packages before publishing either, then publishes library first
      # and stops at the first failure; see the script for recovery.
      - name: Publish to npm
        run: bash .github/scripts/publish-packages.sh "${{ steps.meta.outputs.tag }}"
